NANO_CIDATA_SIZE="54m"
EMBEDDEDPORTS="sysutils/u-boot-pine64"

FDT_OVERLAYS="sun50i-a64-timer"

UBOOT_DIR="/usr/local/share/u-boot/u-boot-pine64"
UBOOT_FILES="u-boot-sunxi-with-spl.bin"

NANO_CIDATADIR="${NANO_OBJ}/_.cidata"

populate_cidata_partition() {
    for _UF in ${UBOOT_FILES}; do
        cp -p ${UBOOT_DIR}/${_UF} \
            ${NANO_CIDATADIR}/${_UF}
    done
}

nanobsd_loader_conf_extra() {
	if [ -z "${FDT_OVERLAYS}" ]; then
		return
	fi

	echo '# DTB OVERLAYS'
	echo "fdt_overlays=\"${FDT_OVERLAYS}\""
}
