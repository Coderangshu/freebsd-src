NANO_CIDATA_SIZE="50m"
EMBEDDEDPORTS="sysutils/u-boot-rockpro64"

UBOOT_DIR="/usr/local/share/u-boot/u-boot-rockpro64"
UBOOT_FILES="idbloader.img u-boot.itb"

NANO_CIDATADIR="${NANO_OBJ}/_.cidata"

populate_cidata_partition() {
    for _UF in ${UBOOT_FILES}; do
        cp -p ${UBOOT_DIR}/${_UF} \
            ${NANO_CIDATADIR}/${_UF}
    done
}
